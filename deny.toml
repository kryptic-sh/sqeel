[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # zip 8 extraction bugs (SUID bits kept, symlinks escaping the
    # destination, permissions applied through symlinks). All three are in
    # `ZipArchive::extract` / `ZipStreamReader::extract`. zip 8 comes only
    # from hjkl-anvil, which never calls either: it reads entries one by one
    # through `safe_join` and writes them as plain files. Drop these once
    # sqeel moves to an hjkl release built on zip 9.
    { id = "RUSTSEC-2026-0367", reason = "hjkl-anvil never calls zip's extract()" },
    { id = "RUSTSEC-2026-0368", reason = "hjkl-anvil never calls zip's extract()" },
    { id = "RUSTSEC-2026-0369", reason = "hjkl-anvil never calls zip's extract()" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
