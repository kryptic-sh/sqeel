[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Bundled SQLite before 3.54.0 can return uninitialized page-cache
    # memory for a database opened beside a crafted `-wal` file. The fix is
    # libsqlite3-sys 0.39, but sqlx-sqlite 0.9.0 (the latest sqlx) requires
    # `>=0.30.1, <0.38.0`, so no release can resolve to it. Drop this once
    # sqlx accepts libsqlite3-sys 0.39.
    { id = "RUSTSEC-2026-0459", reason = "no sqlx release accepts the fixed libsqlite3-sys 0.39" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
